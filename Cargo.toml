[workspace]
members=[
    "crates/sonar",
    "crates/sonard",
]
resolver="3"

[workspace.dependencies]
sonar={ path="crates/sonar" }
clap={ version="4.6.7", features=["derive"] }
serde={ version="1.0.229", features=["derive"] }
toml="1.1.8"
dirs="7.0.0"
pipewire-native="0.2.0"
pipewire-native-spa="0.2.0"
notify-rust="4.18.2"

[profile.release]
opt-level=3
lto=true
codegen-units=1
strip=true